<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- "black": iOS draws an opaque status bar above the page in the installed PWA.
     With "black-translucent" the page went under the clock and the HUD got blurred. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Прилавок">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<title>Тёмный прилавок</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!-- Pixel font is local (public/fonts/); preload it so headings do not wait for the CSS. -->
<link rel="preload" href="/fonts/PublicPixel.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
</head>
<body>
<!-- .ceiling = "station ceiling": decorative strip under the iOS 26+ blurred status bar zone, only in the iOS PWA (html.ios-pwa). -->
<div id="app">
  <div class="ceiling" aria-hidden="true"></div>
  <header class="hud" id="hud"></header>
  <div class="scene"><div class="stage" id="stage">
    <canvas id="scn" width="160" height="100" aria-label="Сцена игры"></canvas>
    <div class="bubble" id="bubble" hidden></div>
    <div class="chip" id="chip"></div>
    <button class="call" id="callBtn" data-a="call" hidden>Позвать следующего</button>
  </div></div>
  <button class="ticker" id="ticker" data-a="log"></button>
  <nav class="tabs" id="tabs"></nav>
  <section class="pane" id="pane"></section>
</div>
<div class="modal" id="modal" hidden><div class="mbox" id="mbox"></div></div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
