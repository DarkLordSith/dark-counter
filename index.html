<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- "black": iOS draws an opaque status bar above the page in the installed PWA.
     With "black-translucent" the page went under the clock and the HUD got blurred. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Прилавок">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<title>Тёмный прилавок</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!-- Pixel font is local (public/fonts/); preload it so headings do not wait for the CSS. -->
<link rel="preload" href="/fonts/PublicPixel.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
</head>
<body>
<!-- .ceiling = "station ceiling": decorative strip under the iOS 26+ blurred status bar zone, only in the iOS PWA (html.ios-pwa). -->
<div id="app">
  <div class="ceiling" aria-hidden="true"></div>
  <div class="scene"><div class="stage" id="stage">
    <canvas id="scn" width="160" height="100" aria-label="Сцена игры"></canvas>
    <!-- the wanted-level meter is drawn on the canvas; this is its text for screen readers -->
    <span class="sr-only" id="heatText" aria-live="polite"></span>
    <div class="bubble" id="bubble" hidden></div>
    <div class="chip" id="chip"></div>
    <!-- hotspot tooltip under the mouse (V2.1, scene.ts); taps go through to the canvas -->
    <div class="hottip" id="hottip" role="tooltip" hidden></div>
  </div></div>
  <button class="ticker" id="ticker" data-a="log"></button>
  <nav class="tabs" id="tabs"></nav>
  <section class="pane" id="pane"></section>
  <!-- action bar (V1.5): the one main button of the screen, in the thumb zone above the HUD -->
  <div class="actionbar" id="actionbar"></div>
  <!-- HUD at the bottom (V1.4 fix): the world on top, the console below -->
  <footer class="hud" id="hud"></footer>
</div>
<!-- window component (V2.2, src/window.ts): a mini window over the scene (mouse) or a sheet above the action bar (finger) -->
<div class="win-back" id="winback" hidden></div>
<section class="win" id="win" role="dialog" aria-modal="true" aria-labelledby="wintitle" tabindex="-1" hidden>
  <header class="win-head"><h2 id="wintitle"></h2><button class="ib win-x" id="winx" type="button"></button></header>
  <div class="win-body" id="winbody"></div>
  <div class="mbtns" id="winbtns"></div>
</section>
<div class="modal" id="modal" hidden><div class="mbox" id="mbox"></div></div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
