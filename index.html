<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1220">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Прилавок">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Тёмный прилавок</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Silkscreen&display=swap">
<style>
/* Layout: one-screen app — compact HUD → pixel scene (shop / junkyard) → ticker → tabs → scrolling pane. Single deliberate dark look. */
:root{
  color-scheme: dark;
  --bg:#0f1220; --panel:#171b2d; --panel2:#1f2440; --line:#2d3455;
  --fg:#dde1f3; --dim:#8b92b5;
  --cyan:#46d3c9; --amber:#f0a33e; --red:#ff6372; --green:#7fd98e;
  --display:'Silkscreen','Courier New',monospace;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--mono);font-size:13px;line-height:1.4;overflow:hidden;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
#app{height:100%;max-width:760px;margin:0 auto;display:flex;flex-direction:column;min-height:0}

.hud{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;padding-block:8px;font-variant-numeric:tabular-nums}
.logo{font-family:var(--display);font-size:12px;color:var(--cyan);margin-right:auto}
.st{display:flex;align-items:baseline;gap:4px;font-size:12px}
.st small{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.st b{font-weight:600}
.heat{display:flex;gap:1px}
.heat i{width:4px;height:9px;background:var(--line)} .heat i.on{background:var(--red)}
.hb{background:var(--panel2);border:1px solid var(--line);padding:3px 7px;font-size:11px}

.scene{flex:none;display:flex;justify-content:center;background:#141829;border:1px solid var(--line)}
.stage{position:relative;height:min(40vh,58vw);aspect-ratio:160/100;max-width:100%;line-height:0}
.stage canvas{width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.bubble{position:absolute;left:3%;top:5%;max-width:44%;line-height:1.3;background:var(--fg);color:#141829;font-size:12px;padding:6px 8px;font-weight:500;box-shadow:3px 3px 0 rgba(0,0,0,.45)}
.bubble::after{content:"";position:absolute;right:-8px;top:10px;border:5px solid transparent;border-left:8px solid var(--fg);border-right:0}
.bubble.free::after{display:none}
.chip{position:absolute;right:2%;top:4%;font-family:var(--display);font-size:10px;line-height:1;background:rgba(10,12,24,.8);color:var(--cyan);padding:4px 6px}
.call{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:var(--display);font-size:13px;line-height:1;background:var(--cyan);color:#0b1620;border:none;padding:11px 14px;box-shadow:4px 4px 0 rgba(0,0,0,.5);white-space:nowrap}
.fx{position:absolute;left:50%;top:46%;transform:translateX(-50%);font-family:var(--display);font-size:18px;line-height:1;pointer-events:none;text-shadow:2px 2px 0 #000}
@media (prefers-reduced-motion:no-preference){.fx{animation:rise 1.2s ease-out forwards}@keyframes rise{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-36px)}}}
@media (prefers-reduced-motion:reduce){.fx{animation:fade 1.2s forwards}@keyframes fade{to{opacity:0}}}

.ticker{flex:none;background:none;border:none;border-bottom:1px solid var(--line);text-align:left;padding:6px 2px;font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ticker b{color:var(--cyan);font-weight:500}
.tabs{flex:none;display:flex;border-bottom:1px solid var(--line)}
.tab{flex:1;background:none;border:none;padding:8px 4px;font-family:var(--display);font-size:11px;color:var(--dim);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--fg);border-bottom-color:var(--cyan)}
.pane{flex:1;min-height:0;overflow:auto;padding-block:10px 14px}

.hint{color:var(--dim)}
.thead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.cname{font-weight:600}
.kind{font-size:10px;letter-spacing:.1em;text-transform:uppercase;margin-left:6px}
.kind.sell{color:var(--amber)} .kind.buy{color:var(--cyan)}
.pips{display:flex;gap:3px} .pips i{width:10px;height:5px;background:var(--line)} .pips i.on{background:var(--amber)}
.card{display:flex;gap:10px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);padding:8px}
.bigico{width:84px;height:48px;flex:none;image-rendering:pixelated;background:var(--panel2)}
.rows{display:grid;grid-template-columns:auto 1fr;gap:1px 10px;font-size:12px;min-width:0}
.rows span:nth-child(odd){color:var(--dim)}
.q{color:var(--dim)} .bad{color:var(--red)} .ok{color:var(--green)} .warn{color:var(--amber)}
.tools{display:flex;gap:5px;margin-top:8px}
.tools .btn{flex:1}
.btn{background:var(--panel2);border:1px solid var(--line);padding:7px 10px;font-size:12px}
.btn:hover:not(:disabled){border-color:var(--cyan)}
.btn:disabled{opacity:.4;cursor:default}
.btn.pri{background:var(--cyan);border-color:var(--cyan);color:#0b1620;font-weight:600}
.btn.amb{border-color:var(--amber);color:var(--amber)}
.price{font-variant-numeric:tabular-nums}
.deal{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.pr{display:flex;gap:4px;align-items:center}
.pr input{flex:1;min-width:0;width:70px;text-align:center;background:var(--bg);border:1px solid var(--line);color:var(--fg);font:inherit;font-size:15px;padding:6px;font-variant-numeric:tabular-nums}
.pr .btn{padding:7px 8px}
.chance{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim)}
.cbar{flex:1;height:6px;background:var(--line);position:relative}
.cbar i{position:absolute;inset:0 auto 0 0;background:var(--amber)}
.acts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px}
.ask{font-size:12px;color:var(--dim)} .ask b{color:var(--fg);font-size:14px}

.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--panel);border:1px solid var(--line);border-bottom:3px solid #2a3152;padding:6px 4px 4px;font-size:10px;line-height:1.2;text-align:center}
.tile.on{border-color:var(--cyan)}
.tile canvas{width:56px;height:32px;image-rendering:pixelated}
.tile .tv{color:var(--dim);font-variant-numeric:tabular-nums}
.dots{position:absolute;top:3px;right:3px;display:flex;gap:2px}
.dots i{width:6px;height:6px} .d-red{background:var(--red)} .d-amb{background:var(--amber)} .d-q{background:var(--line)} .d-ok{background:var(--green)}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:10px;color:var(--dim);margin:8px 0}
.legend i{display:inline-block;width:6px;height:6px;margin-right:3px}
.bench{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.bgrid .btn{display:flex;justify-content:space-between;gap:6px;text-align:left}
.tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
.tag{font-size:9px;letter-spacing:.06em;text-transform:uppercase;padding:1px 4px;border:1px solid var(--line);color:var(--dim)}
.tag.bad{border-color:var(--red);color:var(--red)} .tag.ok{border-color:var(--green);color:var(--green)} .tag.warn{border-color:var(--amber);color:var(--amber)}
.recipes{display:flex;flex-direction:column;gap:6px}
.recipe{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);padding:6px}
.recipe canvas{width:56px;height:32px;image-rendering:pixelated;flex:none}
.recipe .rb{flex:1;min-width:0}
.rn{font-family:var(--display);font-size:11px}
.need{font-size:11px;color:var(--dim)} .need .have{color:var(--green)} .need .miss{color:var(--red)}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;background:var(--panel);border:1px solid var(--line);padding:10px}
.opt:hover:not(:disabled){border-color:var(--cyan)}
.opt:disabled{opacity:.4}
.opt b{font-family:var(--display);font-weight:400;font-size:12px}
.opt span{font-size:11px;color:var(--dim)}
.piles{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:8px 0}

.modal{position:fixed;inset:0;z-index:20;background:rgba(5,7,14,.8);display:flex;align-items:center;justify-content:center;padding:16px}
.mbox{background:var(--panel);border:1px solid var(--cyan);max-width:420px;width:100%;max-height:80vh;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.mbox h2{font-family:var(--display);font-size:16px;color:var(--cyan);margin:0;font-weight:400}
.mbox ul{margin:0;padding-left:16px;display:flex;flex-direction:column;gap:4px}
.mbtns{display:flex;gap:8px;flex-wrap:wrap}
.mbox textarea{width:100%;min-height:72px;background:var(--bg);border:1px solid var(--line);color:var(--fg);font:11px/1.3 var(--mono);padding:6px;resize:vertical;word-break:break-all}
.mbox label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
</style>
</head>
<body>
<div id="app">
  <header class="hud" id="hud"></header>
  <div class="scene"><div class="stage" id="stage">
    <canvas id="scn" width="160" height="100" aria-label="Сцена игры"></canvas>
    <div class="bubble" id="bubble" hidden></div>
    <div class="chip" id="chip"></div>
    <button class="call" id="callBtn" data-a="call" hidden>Позвать следующего</button>
  </div></div>
  <button class="ticker" id="ticker" data-a="log"></button>
  <nav class="tabs" id="tabs"></nav>
  <section class="pane" id="pane"></section>
</div>
<div class="modal" id="modal" hidden><div class="mbox" id="mbox"></div></div>

<script>
const PER_DAY=6, GOAL=5000, KEY='dark-counter-v3', EVE_HOURS=4;
const T={
  comm:{n:'Коммуникатор',b:120,w:3},
  battery:{n:'Энергоячейка',b:90,w:3},
  servo:{n:'Сервопривод',b:160,w:3},
  cutter:{n:'Плазменный резак',b:300,w:2},
  visor:{n:'AR-визор',b:280,w:2,ai:1},
  drone:{n:'Курьерский дрон',b:450,w:1},
  chip:{n:'Нейрочип',b:520,w:1.5,ai:1},
  arm:{n:'Кибер-рука',b:760,w:.7,ai:1},
};
const ELEC=['comm','visor','drone','chip','arm'];
const RECIPES=[
  {out:'visor',need:{comm:1,battery:1},parts:2},
  {out:'cutter',need:{battery:2},parts:3},
  {out:'drone',need:{servo:1,battery:1},parts:3},
  {out:'arm',need:{servo:2,battery:1},parts:4},
];
const NAMES_H=['Рыжий Вик','Тётя Ома','Борн','Лиса из шлюза','Механик Ду','Стас «Провод»','Мира Кейн','Тихий Йоэль','Нана Рокет','Гарри Шов','Курт Дымов','Пак'];
const NAMES_R=['Кси-9','Офелия-3','ТР-404','Болт','Юнит-7','Мама-Кран','Р-Скрип','Ось'];
const SELL_LINES=['Глянь, почти новая штука. Почти.','Нашёл на нижнем ярусе. Честно нашёл.','Срочно нужны кредиты, не торгуйся долго.','Отдаю, потому что съезжаю со станции.','Не спрашивай, откуда. Спроси, сколько.'];
const BUY_LINES=['Мне нужен {t}. Сегодня.','Говорят, у тебя бывает {t}. Покажешь?','Ищу {t}, без лишних вопросов.','Шеф велел достать {t}. Деньги есть.'];

const rnd=(a,b)=>a+Math.random()*(b-a), ri=(a,b)=>Math.floor(rnd(a,b+1)), pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function pickType(){const ks=Object.keys(T),tot=ks.reduce((s,k)=>s+T[k].w,0);let r=Math.random()*tot;for(const k of ks){r-=T[k].w;if(r<=0)return k}return ks[0]}
const cleanVal=it=>Math.round(T[it.t].b*(.3+.7*it.cond/100));
const trueVal=it=>Math.round(cleanVal(it)*(it.defect?.5:1)*(it.infected?.15:1));
function estVal(it){const c=it.k.cond?it.cond:60;let v=T[it.t].b*(.3+.7*c/100);if(it.k.flaw&&it.defect)v*=.5;if(it.k.flaw&&it.infected)v*=.15;return Math.round(v)}
const buyerBase=it=>T[it.t].b*(.3+.7*it.cond/100)*(it.defect?.7:1);

let S, ui={tab:'deal',sel:null};
const A={phase:'empty',x:140,seed:0,scan:0,door:0};
const DOOR_X=138, SPOT_X=80, SPEED=46;

/* ---------- state ---------- */
function newGame(){
  S={day:1,slot:0,credits:400,parts:4,heat:0,rent:300,uid:0,inv:[],log:[],cust:null,over:null,won:false,phase:'shop',hours:0,where:'home',junk:null,jmsg:'',market:false,
    nextDue:3,owed:300,deferred:false,llAt:ri(1,4),llDone:false};
  S.inv.push(mkItem('battery',{cond:70,stolen:false,defect:false,infected:false,known:true}));
  S.inv.push(mkItem('comm',{cond:55,stolen:false,defect:false,infected:false,known:true}));
  addLog('День 1. Лавка 7-Б, нижний ярус. Аренда каждые 3 дня, и она растёт.');
  A.phase='empty';A.x=DOOR_X;ui.tab='deal';
}
function mkItem(t,o={}){
  const it={uid:++S.uid,t,cond:o.cond??ri(15,98),stolen:o.stolen??Math.random()<.25,defect:o.defect??Math.random()<.25,
    infected:o.infected??(!!T[t].ai&&Math.random()<.35),k:{cond:false,serial:false,flaw:false}};
  if(o.known)it.k={cond:true,serial:true,flaw:true};
  return it;
}
function newCustomer(forceSell){
  const buy=!forceSell&&S.inv.length&&Math.random()<.45;
  const seed=Math.floor(Math.random()*1e9)+1,L=look(seed);
  const c={name:pick(L.kind==='human'?NAMES_H:NAMES_R),seed,pat:ri(4,6),done:{},noise:rnd(-.12,.12)};
  c.max=c.pat;
  if(buy){
    c.kind='buy';c.want=Math.random()<.7?pick(S.inv).t:pickType();c.mult=rnd(1.1,1.5);c.item=null;
    c.msg=pick(BUY_LINES).replace('{t}',T[c.want].n.toLowerCase());
  }else{
    c.kind='sell';const it=mkItem(pickType());c.item=it;
    c.ask=Math.round(cleanVal(it)*rnd(1.05,1.35));
    c.min=Math.round(trueVal(it)*(it.stolen?.45:.75));
    c.msg=it.stolen&&Math.random()<.6?'Быстро. Кредиты вперёд, вопросы потом.':pick(SELL_LINES);
  }
  S.cust=c;
}
function addLog(s){S.log.unshift(`Д${S.day}: ${s}`);S.log=S.log.slice(0,50)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.inv&&d.phase)return d}catch(e){}return null}
function fx(text,color){const el=document.createElement('div');el.className='fx';el.textContent=text;el.style.color=color;$('stage').appendChild(el);setTimeout(()=>el.remove(),1300)}

/* ---------- shop flow ---------- */
const LL=777;
function llPending(){return !S.won&&!S.over&&S.phase==='shop'&&S.day>=S.nextDue&&!S.llDone}
function callNext(){
  if(S.phase!=='shop'||S.cust||S.over||A.phase!=='empty')return;
  if(llPending()&&S.slot>=Math.min(S.llAt,PER_DAY))return spawnLandlord();
  if(S.slot>=PER_DAY)return;
  newCustomer(S.day===1&&S.slot===0);A.phase='in';A.x=DOOR_X;A.seed=S.cust.seed;ui.tab='deal';
}
function spawnLandlord(){
  const msg=S.deferred?`Отсрочка кончилась. С тебя ${S.owed} кр., сегодня.`:
    S.credits>=S.owed?`Аренда. ${S.owed} кр., как договаривались.`:`Аренда, ${S.owed} кр. Не хватает? Могу подождать пару дней. Под процент.`;
  S.cust={kind:'rent',name:'Арендодатель Гробов',seed:LL,msg,pat:0,max:0,done:{}};
  A.phase='in';A.x=DOOR_X;A.seed=LL;ui.tab='deal';
}
function leave(text){addLog(`${S.cust.name} ушёл(ла). ${text||''}`);finishCustomer()}
function finishCustomer(){A.phase='out';A.seed=S.cust.seed;const ll=S.cust.kind==='rent';S.cust=null;if(!ll)S.slot++}

/* ---------- rent ---------- */
const appraise=it=>Math.max(5,Math.round(trueVal(it)*(it.stolen?.5:.6)));
function collateralPlan(){
  const cash=Math.min(S.credits,S.owed);let rem=S.owed-cash;const items=[];
  while(rem>0){
    const all=S.inv.filter(i=>!items.includes(i));if(!all.length)break;
    const st=all.filter(i=>i.stolen),pool=st.length?st:all;
    const cover=pool.filter(i=>appraise(i)>=rem).sort((a,b)=>appraise(a)-appraise(b));
    const it=cover[0]||pool.sort((a,b)=>appraise(b)-appraise(a))[0];items.push(it);rem-=appraise(it);
  }
  return{cash,items,ok:rem<=0,over:Math.max(0,-rem),hot:items.filter(i=>i.stolen).length};
}
function rentSettled(){S.deferred=false;S.rent+=150;S.nextDue=S.day+3;S.owed=S.rent;S.llDone=true}
function payRent(){
  if(S.credits<S.owed)return;const p=S.owed;S.credits-=p;fx(`−${p}`,'#ff6372');
  addLog(`Аренда оплачена: ${p} кр. Следующая: ${S.rent+150} кр. на день ${S.day+3}.`);
  S.cust.msg='Приятно иметь дело.';rentSettled();finishCustomer();
}
function deferRent(){
  if(S.deferred)return;
  S.owed=Math.round(S.owed*1.2/10)*10;S.nextDue=S.day+2;S.deferred=true;S.llDone=true;
  addLog(`Отсрочка до дня ${S.nextDue}. Долг вырос до ${S.owed} кр.`);finishCustomer();
}
function payCollateral(){
  const pl=collateralPlan();if(!pl.ok)return;
  S.credits-=pl.cash;S.inv=S.inv.filter(i=>!pl.items.includes(i));
  if(pl.items.some(i=>i.uid===ui.sel))ui.sel=null;
  if(pl.cash)fx(`−${pl.cash}`,'#ff6372');
  const cool=Math.min(S.heat,pl.hot*2);S.heat-=cool;
  addLog(`Гробов забрал ${pl.cash} кр. и товар: ${pl.items.map(i=>T[i.t].n).join(', ')}.${pl.over?` Сдачи не будет (переплата ~${pl.over} кр.).`:''}${pl.hot?` Краденое (${pl.hot}) ушло по его каналам, розыск −${cool}.`:''}`);
  rentSettled();finishCustomer();
}
function evict(){
  S.over=`Долг ${S.owed} кр. нечем покрыть. Гробов опечатал лавку.`;addLog(S.over);finishCustomer();
  openModal('Выселение',`<p>${S.over}</p>`,`<button class="btn pri" data-a="newgame-yes">Новая игра</button>`);
}
function losePat(n){S.cust.pat=Math.max(0,S.cust.pat-n)}

function inspect(kind){
  const c=S.cust,it=c.item;if(c.done[kind])return;c.done[kind]=1;A.scan=performance.now();
  if(c.pat>1)losePat(1);
  if(kind==='cond'){it.k.cond=true;c.msg=`Состояние ${it.cond}%. ${it.cond<40?'Ну, работает же.':'Видишь, хорошая вещь.'}`}
  if(kind==='serial'){it.k.serial=true;
    if(it.stolen){c.ask=Math.max(c.min,Math.round(c.ask*.7));c.min=Math.round(c.min*.85);c.msg='…Серийник? Его и не было. Ладно, скину цену.'}
    else c.msg='Серийник чистый, сам видишь.'}
  if(kind==='flaw'){it.k.flaw=true;
    if(it.infected){c.ask=Math.max(c.min,Math.round(c.ask*.5));c.min=Math.round(c.min*.6);c.msg='Какой ещё ИИ? Я не знал! Забирай дешевле.'}
    else if(it.defect){c.ask=Math.max(c.min,Math.round(c.ask*.75));c.msg='Ну да, контакт отходит. Учту в цене.'}
    else c.msg='Начинка в порядке. Говорил же.'}
}
/* acceptance probability: 50% at hidden limit, ~97% at their own price */
function pSell(c,v){
  if(v>=c.ask)return 1;
  const lo=c.min*.7;if(v<=lo)return 0;
  if(v<c.min)return .5*(v-lo)/(c.min-lo);
  return clamp(.5+.47*(v-c.min)/Math.max(1,c.ask-c.min),0,.97);
}
function pBuy(c,v){
  if(v<=c.offer)return 1;
  const hi=c.max2*1.35;if(v>=hi)return 0;
  if(v<=c.max2)return clamp(1-.5*(v-c.offer)/Math.max(1,c.max2-c.offer),.5,.97);
  return .5*(hi-v)/(hi-c.max2);
}
function feel(c,v){const p=c.kind==='sell'?pSell(c,v):pBuy(c,v);if(p>=1||p<=0)return p;return clamp(Math.round((p+c.noise)*20)/20,.05,.95)}
function sellerOffer(v){
  const c=S.cust;
  if(v>S.credits){c.msg='У тебя столько нет, не смеши.';return}
  if(v>=c.ask)return buyFrom(c.ask);
  if(Math.random()<pSell(c,v))return buyFrom(v);
  if(v<c.min*.7){losePat(2);c.msg=pick(['Это оскорбление.','Ты издеваешься?','За эти деньги сам собери.'])}
  else{losePat(1);c.ask=Math.round(Math.max(c.min,c.ask-(c.ask-v)*.3));c.msg=pick(['Нет. Давай так:','Не пойдёт. Моя цена:','Хм… нет. Могу за'])+` ${c.ask} кр.`}
  if(c.pat<=0)leave('Не сторговались.');
}
function buyFrom(p){
  const c=S.cust,it=c.item;
  S.credits-=p;S.inv.push(it);if(it.stolen)S.heat=Math.min(10,S.heat+1);
  addLog(`Куплено: ${T[it.t].n} за ${p} кр. у ${c.name}.`);fx(`−${p}`,'#f0a33e');
  ui.sel=it.uid;finishCustomer();
}
function showItem(uid){
  const c=S.cust,it=S.inv.find(i=>i.uid===uid);if(!it)return;
  c.item=it;c.max2=Math.round(buyerBase(it)*c.mult);c.offer=Math.round(c.max2*.65);
  c.msg=`${it.cond<45?'Потрёпан. ':''}Дам ${c.offer} кр.`;
}
function buyerAsk(v){
  const c=S.cust;
  if(v<=c.offer)return sellTo(c.offer);
  if(Math.random()<pBuy(c,v))return sellTo(v);
  if(v>c.max2*1.5){losePat(2);c.msg=pick(['За такие деньги я новый куплю.','Ты бредишь.'])}
  else{losePat(1);c.offer=Math.round(c.offer+(c.max2-c.offer)*.35);c.msg=pick(['Дорого. Могу','Ладно, подниму:','Последнее слово —'])+` ${c.offer} кр.`}
  if(c.pat<=0)leave('Не сторговались.');
}
function sellTo(p){
  const c=S.cust,it=c.item;
  S.credits+=p;S.inv=S.inv.filter(i=>i.uid!==it.uid);if(ui.sel===it.uid)ui.sel=null;
  let note='';
  if(it.stolen){S.heat=Math.min(10,S.heat+1);note=' Краденое ушло дальше.'}
  if(it.infected){S.heat=Math.min(10,S.heat+2);note+=' Вещь была заражена ИИ, служба безопасности насторожилась.'}
  addLog(`Продано: ${T[it.t].n} за ${p} кр. (${c.name}).${note}`);fx(`+${p}`,'#7fd98e');
  finishCustomer();
}

/* ---------- evening + junkyard ---------- */
const PILES=[{x:30,y:76,w:38,h:14},{x:80,y:74,w:42,h:15},{x:130,y:76,w:38,h:14},{x:28,y:97,w:44,h:16},{x:80,y:97,w:46,h:17},{x:132,y:97,w:44,h:16}];
function closeShop(){S.phase='evening';S.hours=EVE_HOURS;S.where='home';S.market=false;ui.tab='deal';addLog('Лавка закрыта. Вечер свободен.')}
function goJunk(){
  if(S.hours<2)return;S.hours--;S.where='junk';
  S.junk={piles:PILES.map(()=>({dug:false,seed:Math.floor(Math.random()*1e9)+1}))};
  S.jmsg='Свалка «Кольцо Б». Выберите кучу и копайте. Каждая куча — час.';
}
function dig(i){
  if(S.where!=='junk'||S.hours<1)return;const p=S.junk.piles[i];if(!p||p.dug)return;
  p.dug=true;S.hours--;let msg;
  const r=Math.random();
  if(r<.1){S.hours=Math.max(0,S.hours-1);msg='Сторожевой дрон! Пришлось прятаться, час потерян.'}
  else if(r<.48){const n=ri(1,4);S.parts+=n;msg=`Нашлись запчасти: +${n}.`;fx(`+${n} ⚙`,'#46d3c9')}
  else if(r<.86){const t=pickType();const it=mkItem(t,{cond:ri(5,40),defect:Math.random()<.5,stolen:Math.random()<.1});S.inv.push(it);msg=`Откопал: ${T[t].n}, сломанный. Отнесу на верстак.`;fx('+1','#f0a33e')}
  else if(r<.94){const t=pick(['chip','arm','drone','visor']);const it=mkItem(t,{cond:ri(40,80),stolen:false});S.inv.push(it);msg=`Редкая находка: ${T[t].n}!`;fx('★','#f0a33e')}
  else msg='Пусто. Только ржавые болты.';
  S.jmsg=msg;addLog('Свалка: '+msg);
  if(S.hours<=0){S.where='home';S.jmsg='';addLog('Стемнело окончательно, пора домой.')}
}
function sleep(){S.where='home';endDay()}
function endDay(){
  const ev=[];
  S.inv.filter(i=>i.infected).forEach(()=>{
    if(Math.random()<.35){const tg=S.inv.filter(i=>!i.infected&&ELEC.includes(i.t));if(tg.length){const v=pick(tg);v.infected=true;v.k.flaw=false;ev.push(`Ночью на складе что-то мигало. ${T[v.t].n} ведёт себя странно.`)}}
  });
  S.day++;S.slot=0;S.phase='shop';S.hours=0;S.junk=null;S.llDone=false;S.llAt=ri(1,4);
  if(!S.won&&S.day>=S.nextDue)ev.push(`Сегодня зайдёт арендодатель: ${S.owed} кр.${S.deferred?' Отсрочки больше не будет.':''}`);
  const before=S.heat;S.heat=Math.max(0,S.heat-1);
  if(!S.over&&Math.random()<before*.1){
    const st=S.inv.filter(i=>i.stolen);const fine=50+st.length*60;
    S.inv=S.inv.filter(i=>!i.stolen);S.credits=Math.max(0,S.credits-fine);S.heat=0;
    ev.push(`Утренний рейд патруля. Изъято краденого: ${st.length}. Штраф ${fine} кр.`);
  }
  if(!ev.length)ev.push('Тихая ночь на нижнем ярусе.');
  ev.forEach(e=>addLog(e));
  openModal(S.over?'Выселение':`Утро. День ${S.day}`,`<ul>${ev.map(e=>`<li>${e}</li>`).join('')}</ul>`,S.over?
    `<button class="btn pri" data-a="newgame-yes">Новая игра</button>`:`<button class="btn pri" data-a="close">Открыть лавку</button>`);
}

/* ---------- workbench / craft ---------- */
const scrapVal=it=>Math.max(1,Math.round(T[it.t].b/80+it.cond/50));
const onCounter=it=>S.cust&&S.cust.item&&S.cust.item.uid===it.uid;
function benchAct(a){
  const it=S.inv.find(i=>i.uid===ui.sel);if(!it)return;
  const cost={diag:1,repair:2,fix:3,purge:2,wipe:3}[a]||0;
  if(S.parts<cost)return;S.parts-=cost;
  if(a==='diag'){it.k={cond:true,serial:true,flaw:true};addLog(`Диагностика: ${T[it.t].n}.`)}
  if(a==='repair'){it.cond=Math.min(100,it.cond+25);it.k.cond=true;addLog(`Ремонт: ${T[it.t].n} → ${it.cond}%.`)}
  if(a==='fix'){it.defect=false;addLog(`Дефект устранён: ${T[it.t].n}.`)}
  if(a==='purge'){it.infected=false;addLog(`ИИ вычищен из: ${T[it.t].n}.`)}
  if(a==='wipe'){it.stolen=false;S.heat=Math.min(10,S.heat+1);addLog(`Серийник перебит: ${T[it.t].n}.`)}
  if(a==='scrap'){if(onCounter(it))return;const p=scrapVal(it);S.parts+=p;S.inv=S.inv.filter(i=>i!==it);ui.sel=null;addLog(`Разобрано: ${T[it.t].n}, +${p} запч.`)}
}
const avail=t=>S.inv.filter(i=>i.t===t&&!onCounter(i));
function canCraft(r){return S.parts>=r.parts&&Object.entries(r.need).every(([t,n])=>avail(t).length>=n)}
function craft(i){
  const r=RECIPES[i];if(!canCraft(r))return;
  const used=[];Object.entries(r.need).forEach(([t,n])=>used.push(...avail(t).slice(0,n)));
  S.inv=S.inv.filter(x=>!used.includes(x));S.parts-=r.parts;
  const cond=Math.min(100,Math.round(used.reduce((s,x)=>s+x.cond,0)/used.length+10));
  const it=mkItem(r.out,{cond,stolen:false,defect:false,infected:used.some(x=>x.infected),known:true});
  S.inv.push(it);ui.sel=it.uid;ui.tab='inv';fx('СОБРАНО','#46d3c9');
  addLog(`Собрано: ${T[r.out].n} (${cond}%).${it.infected?' Похоже, ИИ перебрался в новую сборку.':''}`);
}

function dotsFor(it){

function drawPile(i,now){

/* ---------- space lofi (WebAudio) ---------- */
const audio={on:false,ac:null};
const mtof=m=>440*Math.pow(2,(m-69)/12);
const CH=[[53,57,60,64],[52,55,59,62],[50,53,57,60],[48,52,55,59]];
const PENTA=[72,74,76,79,81,84];
function initAudio(){
  const ac=new (window.AudioContext||window.webkitAudioContext)();audio.ac=ac;
  const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1600;
  const master=ac.createGain();master.gain.value=.55;master.connect(lp);lp.connect(ac.destination);audio.master=master;
  const len=ac.sampleRate*2,nb=ac.createBuffer(1,len,ac.sampleRate),d=nb.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=Math.random()*2-1;audio.noise=nb;
  const cb=ac.createBuffer(1,len,ac.sampleRate),cd=cb.getChannelData(0);
  for(let i=0;i<len;i++)cd[i]=(Math.random()<.0006?(Math.random()*2-1)*.6:0)+(Math.random()*2-1)*.012;
  const cr=ac.createBufferSource();cr.buffer=cb;cr.loop=true;const cg=ac.createGain();cg.gain.value=.5;cr.connect(cg);cg.connect(master);cr.start();
  audio.step=0;audio.next=ac.currentTime+.1;audio.spb=60/72/4;setInterval(sched,25);
}
function env(gn,t,a,peak,rel){gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(peak,t+a);gn.gain.exponentialRampToValueAtTime(.0001,t+a+rel)}
function noiseHit(t,type,freq,peak,dur){const ac=audio.ac,s=ac.createBufferSource();s.buffer=audio.noise;const f=ac.createBiquadFilter();f.type=type;f.frequency.value=freq;const gn=ac.createGain();env(gn,t,.002,peak,dur);s.connect(f);f.connect(gn);gn.connect(audio.master);s.start(t,Math.random());s.stop(t+dur+.05)}
function tone(t,freq,type,peak,a,rel){const ac=audio.ac,o=ac.createOscillator(),gn=ac.createGain();o.type=type;o.frequency.value=freq;env(gn,t,a,peak,rel);o.connect(gn);gn.connect(audio.master);o.start(t);o.stop(t+a+rel+.05)}
function sched(){
  if(!audio.on)return;const ac=audio.ac;
  while(audio.next<ac.currentTime+.12){
    const t=audio.next,st=audio.step%16,bar=Math.floor(audio.step/16)%4,ch=CH[bar];
    if(st===0||st===10&&Math.random()<.5||st===8&&Math.random()<.3){const o=ac.createOscillator(),gn=ac.createGain();o.frequency.setValueAtTime(110,t);o.frequency.exponentialRampToValueAtTime(42,t+.15);env(gn,t,.003,.7,.22);o.connect(gn);gn.connect(audio.master);o.start(t);o.stop(t+.3)}
    if(st===4||st===12)noiseHit(t,'bandpass',1700,.18,.16);
    if(st%2===0)noiseHit(t+(st%4===2?audio.spb*.18:0),'highpass',7000,st%4===2?.05:.03,.04);
    if(st===0){ch.forEach(n=>{tone(t,mtof(n),'triangle',.05,.6,audio.spb*15);tone(t,mtof(n)*1.004,'sine',.04,.8,audio.spb*15)});tone(t,mtof(ch[0]-24),'sine',.22,.02,audio.spb*7);tone(t+audio.spb*8,mtof(ch[0]-24),'sine',.18,.02,audio.spb*6)}
    if((st===6||st===14)&&Math.random()<.35)tone(t,mtof(pick(PENTA)),'sine',.045,.01,.9);
    audio.next+=audio.spb;audio.step++;
  }
}
function toggleMusic(){try{if(!audio.ac)initAudio();audio.on=!audio.on;if(audio.on){audio.ac.resume();audio.next=audio.ac.currentTime+.1}else audio.ac.suspend()}catch(e){audio.on=false}}

function migrate(d){if(d&&d.nextDue==null){d.nextDue=d.day+((3-d.day%3)%3);d.owed=d.rent;d.deferred=false;d.llAt=ri(1,4);d.llDone=false}return d}

function importSave(code){try{code=(code||'').trim().replace(/\s+/g,'');if(code.startsWith('DC1:'))code=code.slice(4);const d=JSON.parse(decodeURIComponent(escape(atob(code))));if(!d||!Array.isArray(d.inv)||!d.phase||typeof d.credits!=='number')return null;return migrate(d)}catch(e){return null}}
